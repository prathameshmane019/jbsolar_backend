spring.application.name=jbsolar
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}

# PostgreSQL is used by default. Override these values with environment variables in deployed environments.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jbsolar}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# The default key is for local development only; set JWT_SECRET to a random secret in every deployment.
app.security.jwt-secret=${JWT_SECRET:local-development-only-jbsolar-jwt-secret-change-me-please}
app.security.identity-hash-key=${IDENTITY_HASH_KEY:local-development-only-identity-hash-key-change-me}
app.security.jwt-expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}
app.storage.neon.endpoint=${AWS_ENDPOINT_URL_S3:}
app.storage.neon.bucket=${NEON_STORAGE_BUCKET:}
app.storage.neon.access-key-id=${AWS_ACCESS_KEY_ID:}
app.storage.neon.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
app.storage.neon.region=${AWS_REGION:}
app.storage.cleanup.fixed-delay-ms=${UPLOAD_CLEANUP_DELAY_MS:3600000}
app.payment.dummy-enabled=${DUMMY_PAYMENT_ENABLED:true}
app.bootstrap-admin.mobile=${APP_ADMIN_MOBILE:}
app.bootstrap-admin.password=${APP_ADMIN_PASSWORD:1234}
