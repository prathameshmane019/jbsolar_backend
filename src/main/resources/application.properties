spring.application.name=jbsolar
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}

# PostgreSQL is used by default. Override these values with environment variables in deployed environments.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jbsolar}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:20000}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=32
server.tomcat.threads.max=${SERVER_TOMCAT_MAX_THREADS:50}
server.tomcat.max-connections=${SERVER_TOMCAT_MAX_CONNECTIONS:100}
server.tomcat.accept-count=${SERVER_TOMCAT_ACCEPT_COUNT:50}
spring.mvc.async.request-timeout=${ASYNC_REQUEST_TIMEOUT_MS:300000}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# The default key is for local development only; set JWT_SECRET to a random secret in every deployment.
app.security.jwt-secret=${JWT_SECRET:local-development-only-jbsolar-jwt-secret-change-me-please}
app.security.identity-hash-key=${IDENTITY_HASH_KEY:local-development-only-identity-hash-key-change-me}
app.security.jwt-expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}
app.storage.oracle.endpoint=${OCI_OBJECT_STORAGE_ENDPOINT:}
app.storage.oracle.namespace=${OCI_NAMESPACE:}
app.storage.oracle.bucket=${OCI_BUCKET:}
app.storage.oracle.access-key-id=${OCI_ACCESS_KEY_ID:}
app.storage.oracle.secret-access-key=${OCI_SECRET_ACCESS_KEY:}
app.storage.oracle.region=${OCI_REGION:}
app.storage.oracle.max-bytes=${APP_STORAGE_MAX_BYTES:20000000000}
app.storage.cleanup.fixed-delay-ms=${UPLOAD_CLEANUP_DELAY_MS:3600000}
app.payment.dummy-enabled=${DUMMY_PAYMENT_ENABLED:true}
app.bootstrap-admin.mobile=${APP_ADMIN_MOBILE:}
app.bootstrap-admin.password=${APP_ADMIN_PASSWORD:1234}
