
name: JB Solar Backend CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jbsolar-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and run tests
        run: ./mvnw --batch-mode clean verify

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: jbsolar-application
          path: |
            target/jbsolar-*.jar
            !target/*-sources.jar
            !target/*-javadoc.jar
            !target/original-*.jar
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Oracle Cloud
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download application JAR
        uses: actions/download-artifact@v4
        with:
          name: jbsolar-application
          path: deployment

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload JAR to Oracle VM
        env:
          HOST: ${{ secrets.OCI_HOST }}
          USER: ${{ secrets.OCI_USER }}
        run: |
          set -euo pipefail

          JAR=$(find deployment -type f -name 'jbsolar-*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            ! -name 'original-*.jar' | head -n 1)

          test -n "$JAR"

          scp -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$JAR" "$USER@$HOST:/tmp/jbsolar-new.jar"

      - name: Deploy and restart
        env:
          HOST: ${{ secrets.OCI_HOST }}
          USER: ${{ secrets.OCI_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$USER@$HOST" \
            'sudo -n /usr/local/sbin/deploy-jbsolar'

      - name: Clean up SSH credentials
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
